NEXUS OS
NEXUS Chat App Prototype

File:
index.html

Pure Static HTML
-->

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="space-background"></div>


<!-- =========================
     APP CONTAINER
========================= -->

<div class="app-container">


    <!-- =========================
         DISCOVER PAGE
    ========================== -->

    <section id="discover-page" class="page active">


        <header class="top-header">

            <div>
                <h1>NEXUS Chat</h1>
                <p>Discover AI Characters</p>
            </div>

            <div class="status-orb"></div>

        </header>



        <!-- Search -->

        <div class="search-box">

            <span>⌕</span>

            <input 
                type="text"
                placeholder="Search AI characters..."
            >

        </div>



        <!-- Featured -->

        <h2 class="section-title">
            Featured Characters
        </h2>



        <div id="character-list" class="character-grid">


            <!-- Character Card Generated By JS -->


        </div>


    </section>





    <!-- =========================
         CHARACTER DETAIL PAGE
    ========================== -->

    <section id="detail-page" class="page">


        <button 
            class="glass-button back-button"
            onclick="goDiscover()">
            ←
        </button>



        <div class="character-detail">


            <img 
                id="detail-avatar"
                class="detail-avatar"
                src=""
                alt="avatar"
            >


            <h1 id="detail-name">
                Character Name
            </h1>


            <p id="detail-intro">
                Introduction
            </p>



            <div 
                id="detail-tags"
                class="tag-container">
            </div>



            <button
                class="start-chat-button"
                onclick="startChat()">

                Start Conversation

            </button>



        </div>


    </section>






    <!-- =========================
         CHAT PAGE
    ========================== -->


    <section id="chat-page" class="page">



        <!-- Chat Header -->

        <header class="chat-header">


            <button 
                class="glass-button"
                onclick="goDiscover()">

                ←

            </button>



            <img
                id="chat-avatar"
                src=""
                class="chat-avatar"
            >



            <div class="chat-user-info">

                <h3 id="chat-name">
                    AI Name
                </h3>

                <span>
                    ● Online
                </span>

            </div>



        </header>





        <!-- Messages -->


        <div 
            id="message-container"
            class="message-container">


            <!-- Messages inserted by JS -->


        </div>





        <!-- Typing -->

        <div 
            id="typing-indicator"
            class="typing hidden">


            <span></span>
            <span></span>
            <span></span>


        </div>






        <!-- Input Area -->


        <div class="chat-input-area">


            <button class="add-button">

                +

            </button>



            <input
                id="message-input"
                type="text"
                placeholder="Message..."
            >



            <button
                class="send-button"
                onclick="sendMessage()">

                ➤

            </button>


        </div>



    </section>



</div>




<script src="script.js"></script>

</body>

</html>
