<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Phone</title>

<link rel="stylesheet" href="./css/style.css">

</head>


<body>


<div class="phone-frame">


    <div class="status-bar">

        <span id="time">
            09:41
        </span>


        <div>
            5G ◉
        </div>

    </div>





    <main class="screen">



        <!-- Home -->

        <section 
        id="home"
        class="app-screen active">


            <div class="app-grid">



                <div class="app"
                onclick="openApp('echo')">


                    <div class="app-icon">
                        ◉
                    </div>


                    <span>
                        Echo
                    </span>


                </div>





                <div class="app"
                onclick="openApp('system')">


                    <div class="app-icon">
                        ⚙
                    </div>


                    <span>
                        System
                    </span>


                </div>





                <div class="app"
                onclick="openApp('core')">


                    <div class="app-icon">
                        ✦
                    </div>


                    <span>
                        Core
                    </span>


                </div>



            </div>



        </section>







        <!-- Echo -->

        <section
        id="echo"
        class="app-screen">


            <header>

                <h1>
                    Echo
                </h1>

                <p>
                    AI Contacts
                </p>


            </header>




            <div id="contacts">

            </div>




            <div id="chat-box">


            </div>




        </section>








        <!-- System -->

        <section
        id="system"
        class="app-screen">


            <header>

                <h1>
                    System
                </h1>

                <p>
                    AI Services
                </p>


            </header>



            <div class="glass-card">

                Chat API

            </div>



            <div class="glass-card">

                Voice API

            </div>



            <div class="glass-card">

                Image API

            </div>



            <div class="glass-card">

                MCP

            </div>



        </section>







        <!-- Core -->

        <section
        id="core"
        class="app-screen">


            <header>

                <h1>
                    Core
                </h1>


                <p>
                    AI Center
                </p>


            </header>




            <div class="core-circle">

                ✦

            </div>



            <div class="glass-card">

                Memory

            </div>



            <div class="glass-card">

                Identity

            </div>



            <div class="glass-card">

                Router

            </div>



        </section>



    </main>



</div>





<script src="./js/app.js"></script>


</body>


</html>
